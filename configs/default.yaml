# Cấu hình mặc định cho pipeline inference.
#
# File này được src/football_analysis/config.py nạp khi import — sửa giá trị ở đây
# là toàn bộ package dùng theo (không cần sửa code). Muốn dùng file khác:
#   - đặt biến môi trường FOOTBALL_CONFIG=đường/dẫn.yaml, hoặc
#   - gọi football_analysis.config.reload("đường/dẫn.yaml") trong code.

models:
  # Một model YOLOv11s phát hiện cả player/ball/goalkeeper/referee (ball = class 0).
  detection: models/players.pt
  # YOLOv11s-pose phát hiện keypoint sân để tính homography.
  pitch_keypoints: models/pitch.pt
  # Hoặc gọi qua Roboflow API thay cho weights local — xem detection.load_models().

inference:
  device: cuda          # cuda | cpu
  conf_threshold: 0.3   # CONF — confidence cho cả 2 model
  kp_conf: 0.5          # KP_CONF — ngưỡng keypoint sân khi tính homography
  nms_iou: 0.5          # IoU cho Non-Maximum Suppression nhóm người
  imgsz_detection: 1280 # độ phân giải infer model detection — PHẢI khớp lúc train
                        # (predict mặc định 640 từng làm sót 5-10 người/frame ở xa)
  imgsz_pitch: 640      # độ phân giải infer model keypoint sân (train @640)

video:
  fps: 25               # quy đổi tốc độ km/h (đọc tự động từ video khi chạy)

team_classifier:
  fit_stride: 20        # bước lấy frame khi gom crop để fit
  switch_ratio: 0.5     # hysteresis — tỉ lệ áp đảo tối thiểu để đổi đội (0.6 = "lì" hơn)

homography:
  # Fit LS toàn bộ keypoint mỗi frame + cắt outlier lệch xa fit toàn cục -> làm mượt
  # CÓ TÂM chuỗi keypoint theo thời gian -> fit lại H mỗi frame (xem pitch.py).
  # KHÔNG dùng cv2.RANSAC (hay khoá vào cụm điểm sát nhau suy biến). Cửa sổ = frame, SỐ LẺ.
  ransac_px: 15.0       # sàn ngưỡng cắt outlier: lệch > max(2x giá trị này, 3x median residual)
  min_inliers: 5        # số keypoint tối thiểu để fit homography của 1 frame
  max_reproj_px: 30.0   # reprojection error tối đa (px); vượt -> bỏ frame, nội suy sau
  median_window: 5      # lọc trung vị chuỗi keypoint — chặn outlier đơn lẻ (1 = tắt)
  smooth_window: 5      # Savitzky-Golay CÓ TÂM trên chuỗi keypoint (1 = tắt hẳn, giống notebook gốc)

speed:
  pos_smooth: 5         # cửa sổ làm mượt vị trí trước khi tính vi sai
  spd_window: 5         # cửa sổ tính vi sai trung tâm
  max_player_ms: 12.0   # loại bước nhảy id-swap (m/s)
  max_kmh: 40           # chặn trên để loại đỉnh nhiễu

ball:
  touch_px: 70.0        # ngưỡng khoảng cách bóng–bàn chân để coi là "chạm bóng" (~1080p)
  max_gap_s: 2.0        # khoảng mất dấu tối đa (giây) còn được nội suy; dài hơn -> ẩn bóng trên map

render:
  show_radar: true      # bật/tắt radar 2D trên video
  show_voronoi: true    # bật/tắt biểu đồ Voronoi
  show_ball: true       # bật/tắt hiển thị quả bóng (trên khung & minimap)
  out_fps: null         # FPS video kết quả; null = giữ fps nguồn (CLI: --out-fps)

output:
  dir: outputs/
